<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>
            🎰 Create Account
        </h1>

        <p class="subtitle">
            Register to play
        </p>


        <form id="registerForm">

            <label>
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Your name"
                required
                minlength="2"
                maxlength="50"
            >


            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="+919876543210"
                required
                autocomplete="tel"
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <button
                type="submit"
                class="primary-button"
            >
                Create Account
            </button>

        </form>


        <div
            id="registerMessage"
            class="form-message"
        ></div>


        <p class="auth-link">

            Already registered?

            <a href="/index.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="/js/auth.js"></script>

</body>

</html>
