<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed</title>
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      padding: 20px;
    }

    .success-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .success-icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      background: #e8f9ef;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-icon span {
      width: 58px;
      height: 58px;
      background: red;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      color: #172033;
      font-size: 28px;
      margin-bottom: 10px;
    }


    .amount {
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .amount small {
      display: block;
      color: #6b7280;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .amount strong {
      font-size: 30px;
      color: #111827;
    }

    .details {
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
      margin-bottom: 28px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .detail:last-child {
      margin-bottom: 0;
    }

    .label {
      color: #6b7280;
    }

    .value {
      color: #1f2937;
      font-weight: 600;
    }

    .status {
      color: red;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .support {
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 480px) {
      .success-card {
        padding: 32px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .amount strong {
        font-size: 26px;
      }
    }
    
    
  </style>
  </head>

<body>
    <div class="success-card">

    <div class="success-icon">
      <span id="status-icon">X</span>
    </div>

    <h1 id="status-text">Payment Failed!</h1>
    
        <div class="amount">
      <small id="amount-text">Amount Paid</small>
      <strong id="amount">₹</strong>
    </div>
    
        <div class="details">
      <div class="detail">
        <span class="label" >Order ID</span>
        <span class="value" id="orderId"></span>
      </div>

      <div class="detail">
        <span class="label">Date</span>
        <span class="value" id="payDate">31 Aug 2026</span>
      </div>

      <div class="detail">
        <span class="label">Status</span>
        <span class="value status" id="status"></span>
      </div>
    </div>
    
        <a href="/game.html" class="button">Continue</a>

    <p class="support">
      A payment confirmation has been sent to your email.
    </p>
    
    </div>
    
    <script>
      const token =
    localStorage.getItem("token");
   const orderId = document.getElementById("orderId");
   const statusValue = document.getElementById("status");
   const dateTime = document.getElementById("payDate");
    const amount = document.getElementById("amount");
    
    const params = new URLSearchParams(window.location.search);
    const id = params.get('orderId');
    const urlStatus = params.get('status');
    const urlamount = params.get('amount');
    const urlTime = params.get('time');
const date = new Date(urlTime);
const formattedDate = date.toISOString().replace('T', ' ').substring(0, 19);
 
console.log(formattedDate); 
// Output: "2026-09-06 10:56:00"

    
      orderId.textContent = id;
      statusValue.textContent = urlStatus;
      amount.textContent = urlamount;
      dateTime.textContent = formattedDate;
      
    </script>
 </body>
</html>
